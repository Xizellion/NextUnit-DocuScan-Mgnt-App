name: nextunit_docuscan_app
description: "NextUnit DocuScan App - Complete Flutter Document Scanner, OCR, Scan to Excel/CSV, Voice Notes & Google Drive Integration"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Camera & Image Pickers
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  
  # Google ML Kit Text Recognition (OCR)
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_commons: ^0.8.0
  
  # Spreadsheet & Data Exporting
  excel: ^4.0.6
  csv: ^6.0.0
  
  # PDF Generation & Native Document Printing (Locked for Flutter 3.22 Compatibility)
  pdf: ^3.10.8
  printing: 5.13.1
  
  # File Management, Storage Access & Sharing
  path_provider: ^2.1.3
  path: ^1.9.0
  share_plus: ^9.0.0
  open_filex: ^4.5.0
  file_picker: ^8.0.5
  
  # Audio / Voice Recording
  record: ^5.1.2
  audioplayers: ^6.0.0
  
  # Permissions Handler
  permission_handler: ^11.3.1
  
  # Cloud & Google Drive Integration
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.5.0
  http: ^1.2.1
  
  # UI & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_spinkit: ^5.2.1

# Version Mismatch & Platform Interface Conflict များကို ကျော်လွှားရန် Overrides
dependency_overrides:
  web: ^0.5.1
  record_platform_interface: 1.5.0
  record_linux: 0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

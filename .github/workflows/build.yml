name: Build NextUnit DocuScan APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APKs (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK (3.22.x LTS)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 4. Configure Modern Flutter & Android Structure
        run: |
          flutter config --no-analytics
          # Clean any conflicting kotlin script gradle files and dummy tests
          rm -f android/app/build.gradle.kts android/build.gradle.kts android/settings.gradle.kts || true
          rm -rf test || true
          # Create or repair clean Android project structure
          flutter create . --org com.nextunit --platforms=android --project-name nextunit_docuscan_app
          rm -rf test || true
          flutter pub get

      - name: 5. Ensure Hardware Permissions & Android v2 Embedding
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST"; then
              sed -i '/<\/application>/i \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST"
            fi
            if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
          fi

      - name: 6. Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Build Android Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 8. Stage APK Outputs for Artifact Download
        run: |
          mkdir -p apk_dist
          cp build/app/outputs/flutter-apk/app-release.apk apk_dist/NextUnit-DocuScan-Release.apk || true
          cp build/app/outputs/flutter-apk/app-debug.apk apk_dist/NextUnit-DocuScan-Debug.apk || true

      - name: 9. Upload APKs as Downloadable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextUnit-DocuScan-APKs
          path: apk_dist/*.apk
          retention-days: 30
          if-no-files-found: error

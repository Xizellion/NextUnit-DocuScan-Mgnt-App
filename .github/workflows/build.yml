name: Build NextUnit DocuScan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Migrate to Flutter v2 Embedding
        run: |
          rm -rf android test build
          mkdir -p assets
          touch assets/.gitkeep
          flutter create . --org com.nextunit --platforms=android --project-name nextunit_docuscan_app --no-pub
          rm -rf test
          mkdir -p assets
          flutter pub get

      - name: 5. Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextUnit-DocuScan-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

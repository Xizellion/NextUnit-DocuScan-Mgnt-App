name: Build NextUnit DocuScan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean Project
        run: |
          mkdir -p assets
          touch assets/.gitkeep
          rm -f android/app/build.gradle.kts android/build.gradle.kts android/settings.gradle.kts || true
          rm -rf test || true
          flutter create . --org com.nextunit --platforms=android --project-name nextunit_docuscan_app --no-pub
          rm -rf test || true
          mkdir -p assets
          flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextUnit-DocuScan-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

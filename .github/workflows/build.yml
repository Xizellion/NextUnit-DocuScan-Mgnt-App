name: Build NextUnit DocuScan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Fix Android v2 Embedding & Clean Project
        run: |
          # Remove obsolete v1 android folder and tests
          rm -rf android test
          mkdir -p assets
          touch assets/.gitkeep

          # Generate modern Flutter v2 Embedding Android files
          flutter create . --org com.nextunit --platforms=android --project-name nextunit_docuscan_app --no-pub
          rm -rf test
          mkdir -p assets

          # Write local.properties for Gradle
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.buildMode=debug" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

          # Get dependencies
          flutter pub get

      - name: 5. Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextUnit-DocuScan-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
